<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>헤어 스타일 · 컬러 피커</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 결과 */
.top{position:sticky;top:0;z-index:5;background:#fff;padding:14px 14px 10px;border-bottom:1px solid #eee}
.gender{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.gender span{font-size:13px;color:#555;margin-right:4px}
.gbtn{padding:5px 14px;border:1px solid #ccc;border-radius:20px;font-size:13px}
.gbtn.on{background:#000;color:#fff;border-color:#000}
.result{min-height:78px;border:2px solid #000;border-radius:14px;padding:12px 14px;font-size:21px;font-weight:700;line-height:1.4;word-break:keep-all;display:flex;align-items:center}
.result.empty{color:#999;font-weight:500;font-size:16px;border-style:dashed;border-color:#bbb}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:24px}
.chip{font-size:12px;padding:3px 10px;border-radius:12px;background:#f2f2f2}
.chip b{margin-left:4px;color:#888}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;height:46px;border-radius:12px;font-size:16px;font-weight:700}
.copy{background:#000;color:#fff}
.reset{border:1px solid #ccc}
/* 미리보기 & 기록 */
.mid{flex:1;padding:12px 14px;overflow:auto}
.preview{display:flex;justify-content:center;margin:4px 0 12px}
.preview svg{width:170px;height:170px;border-radius:18px;background:#f4f1ee}
.hist h3{font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.hist h3 button{font-size:12px;color:#888}
.hist ul{list-style:none}
.hist li{padding:9px 10px;border-bottom:1px solid #eee;font-size:15px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.hist li small{color:#888;font-size:12px;white-space:nowrap}
.hist .none{color:#aaa;font-size:13px;padding:6px 0}
/* 피커 패널 */
.panel{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;gap:22px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none;white-space:nowrap}
.tabs::-webkit-scrollbar,.cards::-webkit-scrollbar{display:none}
.tab{font-size:15px;color:#777;padding-bottom:8px;position:relative;flex:none}
.tab.on{color:#000;font-weight:800}
.tab.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:3px;border-radius:2px;background:#000}
.cards{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none;scroll-behavior:smooth}
.card{flex:none;width:76px;text-align:center}
.card .th{width:76px;height:76px;border-radius:12px;overflow:hidden;border:2.5px solid transparent;position:relative;background:#f4f1ee}
.card .th svg{width:100%;height:100%;display:block}
.card.on .th{border-color:#ff3d7f}
.card.on .th:after{content:"✓";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#ff3d7f;color:#fff;font-size:11px;line-height:18px;font-weight:700}
.card p{font-size:12px;margin-top:5px;line-height:1.25;word-break:keep-all;color:#222}
.card.on p{font-weight:700;color:#ff3d7f}
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 12px;border-top:1px solid #f2f2f2}
.bar .ic{width:44px;height:44px;font-size:22px;display:flex;align-items:center;justify-content:center}
.modes{display:flex;gap:26px}
.mode{font-size:15px;color:#999;padding:6px 0}
.mode.on{color:#000;font-weight:800}
.mode.dis{color:#ccc}
.toast{position:fixed;left:50%;bottom:230px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
<link rel="icon" href="favicon.svg"></head>
<body>
<div class="top">
  <div class="gender"><span>성별</span><button class="gbtn on" data-g="여자">여자</button><button class="gbtn" data-g="남자">남자</button></div>
  <div id="result" class="result empty">스타일과 컬러를 선택하세요</div>
  <div class="chips" id="chips"></div>
  <div class="acts"><button class="reset" id="resetBtn">초기화</button><button class="copy" id="copyBtn">복사</button></div>
</div>
<div class="mid">
  <div class="preview" id="preview"></div>
  <div class="hist"><h3>복사 기록 <button id="clearHist">지우기</button></h3><ul id="hist"></ul></div>
</div>
<div class="panel">
  <div class="tabs" id="tabs"></div>
  <div class="cards" id="cards"></div>
  <div class="bar">
    <button class="ic" id="xBtn" aria-label="초기화">✕</button>
    <div class="modes">
      <button class="mode dis" data-m="stretch">늘리기</button>
      <button class="mode" data-m="color">컬러</button>
      <button class="mode on" data-m="style">스타일</button>
      <button class="mode dis" data-m="retouch">리터치</button>
    </div>
    <button class="ic" id="okBtn" aria-label="복사">✓</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ---------- 데이터 ----------

 {t:"웨이브 헤어",items:[["물결펌","L2n"],["글램펌","L3s"],["엘리자벳펌","L2s"],["빌드펌","L2c"],["히피펌","L3n"],["젤리펌","M2n"],["롱 라티나 컬","L3n"],["프렌치 웨이브","M2s"],["허그펌","M2c"],["내추럴 웨이브","L1n"],["소프트 컬","M1c"],["바디펌","L2e"],["여신 웨이브","L2c"]]},

function wavySide(x1,y1,x2,y2,amp,n){ // 직선을 웨이브로
  if(!amp) return ` L${x2},${y2}`;

  for(let i=0;i<n;i++){const cx=x1+dx*(i+.5)+(i%2?amp:-amp),cy=y1+dy*(i+.5);d+=` Q${cx.toFixed(1)},${cy.toFixed(1)} ${(x1+dx*(i+1)).toFixed(1)},${(y1+dy*(i+1)).toFixed(1)}`;}
  return d;
}

    return {fill:`url(#${id})`,defs:`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${col.c1}"/><stop offset="1" stop-color="${col.c2}"/></linearGradient>`};
  }
  if(col.type==="p") return {fill:`url(#${id})`,defs:`<pattern id="${id}" width="9" height="76" patternUnits="userSpaceOnUse"><rect width="9" height="76" fill="${col.c1}"/><rect x="5" width="2.5" height="76" fill="${col.c2}"/></pattern>`};
  return {fill:col.c1,defs:""};

  bang=bf[B]||"";
  if(L==="z") bang="";
  const skin="#f3d3c0";
  return `<svg viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>
<rect width="76" height="76" fill="#f4f1ee"/>
${extra}${back}
<rect x="33" y="44" width="10" height="12" fill="#ecc3ad"/>
<path d="M8,78 C10,62 24,56 38,56 C52,56 66,62 68,78Z" fill="${male?"#cfd6de":"#e9dfe6"}"/>
<ellipse cx="38" cy="33" rx="13.5" ry="16" fill="${skin}"/>
<ellipse cx="33" cy="34" rx="1.3" ry="1.6" fill="#3a2a25"/><ellipse cx="43" cy="34" rx="1.3" ry="1.6" fill="#3a2a25"/>
<path d="M35,42 q3,2 6,0" stroke="#c9767a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
${front}${cap}${bang}
<path d="M28,16 C33,13 40,13 45,15" stroke="#fff" stroke-opacity=".28" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>`;
}
/* ---------- 텍스트 변환 ---------- */
function styleText(n){return n.replace(/씨컬/g,"C컬").replace(/에스컬/g,"S컬").replace(/제이컬/g,"J컬");}
function colorText(n){return n.endsWith("컬러")?n:(n.includes(" ")?n+" 컬러":n+"컬러");}
function sentence(){
  if(!S.style&&!S.color) return "";
  const parts=[S.gender+"헤어"];
  if(S.style) parts.push(styleText(S.style.n));
  if(S.color) parts.push(colorText(S.color.n));
  return parts.join(" ");
}
function colObj(it){return {n:it[0],c1:it[1],c2:it[2]||it[1],type:it[3]||"s"};}
/* ---------- 렌더 ---------- */
function renderTabs(){
  const tabs=S.mode==="style"?STYLE_TABS:COLOR_TABS, cur=S.mode==="style"?S.sTab:S.cTab;
  $("tabs").innerHTML=tabs.map((t,i)=>`<button class="tab${i===cur?" on":""}" data-i="${i}">${t.t}</button>`).join("");
  const on=$("tabs").querySelector(".on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
}
function renderCards(){
  let html="";
  if(S.mode==="style"){
    const tab=STYLE_TABS[S.sTab];
    html=tab.items.map((it,i)=>{const sel=S.style&&S.style.tab===S.sTab&&S.style.i===i;
      return `<button class="card${sel?" on":""}" data-i="${i}"><div class="th">${hairSVG(it[1],S.color)}</div><p>${it[0]}</p></button>`}).join("");
  }else{
    const tab=COLOR_TABS[S.cTab];
    const code=S.style?S.style.code:"L1n";
    html=tab.items.map((it,i)=>{const sel=S.color&&S.color.tab===S.cTab&&S.color.i===i;
      return `<button class="card${sel?" on":""}" data-i="${i}"><div class="th">${hairSVG(code,colObj(it))}</div><p>${it[0]}</p></button>`}).join("");
  }
  $("cards").innerHTML=html;
}
function renderResult(){
  const s=sentence(), r=$("result");
  r.textContent=s||"스타일과 컬러를 선택하세요"; r.classList.toggle("empty",!s);
  let c="";
  if(S.style) c+=`<span class="chip">스타일: ${S.style.n}<b data-x="style">✕</b></span>`;
  if(S.color) c+=`<span class="chip">컬러: ${S.color.n}<b data-x="color">✕</b></span>`;
  $("chips").innerHTML=c;
  document.querySelectorAll(".gbtn").forEach(b=>b.classList.toggle("on",b.dataset.g===S.gender));
  $("preview").innerHTML=hairSVG(S.style?S.style.code:(S.gender==="남자"?"m0f":"M1n"),S.color);
}
function renderModes(){document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.m===S.mode));}
function renderAll(){renderModes();renderTabs();renderCards();renderResult();}
/* ---------- 이벤트 ---------- */
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;
  if(S.mode==="style")S.sTab=+b.dataset.i;else S.cTab=+b.dataset.i;
  renderTabs();renderCards();$("cards").scrollLeft=0;};
$("cards").onclick=e=>{const b=e.target.closest(".card");if(!b)return;const i=+b.dataset.i;
  if(S.mode==="style"){
    if(S.style&&S.style.tab===S.sTab&&S.style.i===i)S.style=null;
    else{const it=STYLE_TABS[S.sTab].items[i];S.style={tab:S.sTab,i,n:it[0],code:it[1]};
      if(!S.gManual)S.gender=STYLE_TABS[S.sTab].male?"남자":"여자";}
  }else{
    if(S.color&&S.color.tab===S.cTab&&S.color.i===i)S.color=null;
    else{const it=COLOR_TABS[S.cTab].items[i];S.color=Object.assign(colObj(it),{tab:S.cTab,i});}
  }
  const sl=$("cards").scrollLeft;renderCards();$("cards").scrollLeft=sl;renderResult();};
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
  if(b.classList.contains("dis")){toast("웹앱에서는 스타일·컬러만 지원해요");return;}
  S.mode=b.dataset.m;renderModes();renderTabs();renderCards();$("cards").scrollLeft=0;});
document.querySelectorAll(".gbtn").forEach(b=>b.onclick=()=>{S.gender=b.dataset.g;S.gManual=true;renderResult();});
$("chips").onclick=e=>{const x=e.target.dataset.x;if(!x)return;S[x]=null;renderCards();renderResult();};
function reset(){S.style=null;S.color=null;S.gManual=false;S.gender="여자";renderCards();renderResult();toast("초기화했어요");}
$("resetBtn").onclick=reset;$("xBtn").onclick=reset;
/* ---------- 복사 ---------- */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);return ok;}
async function copyText(text){
  if(!text){toast("먼저 스타일이나 컬러를 선택하세요");return;}
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
  if(!ok)ok=fallbackCopy(text);
  toast(ok?"복사했어요: "+text:"복사 실패 — 길게 눌러 직접 복사하세요");
  if(ok)addHist(text);
}
$("copyBtn").onclick=()=>copyText(sentence());$("okBtn").onclick=()=>copyText(sentence());
/* ---------- 기록 ---------- */
const HK="bp-hair-history";
function getHist(){try{return JSON.parse(localStorage.getItem(HK))||[]}catch(e){return []}}
function addHist(t){let h=getHist().filter(x=>x.t!==t);h.unshift({t,d:Date.now()});h=h.slice(0,20);try{localStorage.setItem(HK,JSON.stringify(h));}catch(e){}renderHist();}
function renderHist(){const h=getHist();
  $("hist").innerHTML=h.length?h.map(x=>{const d=new Date(x.d);return `<li data-t="${x.t.replace(/"/g,"&quot;")}"><span>${x.t}</span><small>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</small></li>`}).join(""):'<li class="none" style="cursor:default">아직 복사한 문장이 없어요</li>';}
$("hist").onclick=e=>{const li=e.target.closest("li[data-t]");if(li)copyText(li.dataset.t);};
$("clearHist").onclick=()=>{localStorage.removeItem(HK);renderHist();};
renderAll();renderHist();
</script>
</body>
</html>
