<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>헤어 스타일 · 컬러 피커</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:2560px;margin:0 auto;padding:0 clamp(12px,2vw,48px)}
/* 상단 고정 바 */
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid #e8e8e8}
.bar{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:800;white-space:nowrap;margin-right:4px}
.sel{display:flex;gap:6px;flex:none}
.sel .mini{width:56px;height:56px;border-radius:10px;background:#f2f2f2;overflow:hidden;position:relative;border:1px solid #e5e5e5}
.sel .mini img{width:100%;height:100%;object-fit:cover;display:block}
.sel .mini span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#aaa}
.sel .mini b{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:10px;line-height:18px;text-align:center;cursor:pointer}
.result{flex:1 1 360px;min-height:56px;border:2px solid #000;border-radius:14px;padding:10px 16px;font-size:clamp(18px,1.4vw,26px);font-weight:800;line-height:1.35;word-break:keep-all;display:flex;align-items:center}
.result.empty{color:#999;font-weight:500;font-size:16px;border-style:dashed;border-color:#bbb}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gender{display:flex;border:1px solid #ccc;border-radius:22px;overflow:hidden}
.gbtn{padding:0 16px;height:44px;font-size:15px}
.gbtn.on{background:#000;color:#fff}
.act{height:48px;padding:0 26px;border-radius:12px;font-size:16px;font-weight:800}
.copy{background:#000;color:#fff}
.reset{border:1px solid #ccc}
.hist{display:flex;align-items:center;gap:8px;padding:0 0 10px;overflow-x:auto;scrollbar-width:thin;white-space:nowrap}
.hist .lbl{font-size:12px;color:#888;flex:none}
.hist .h{flex:none;font-size:13px;padding:5px 12px;border-radius:14px;background:#f2f2f2;cursor:pointer}
.hist .h:hover{background:#e6e6e6}
.hist .none{font-size:12px;color:#bbb}
.hist .clr{flex:none;font-size:12px;color:#888;text-decoration:underline;margin-left:auto}
/* 섹션 */
section{padding:28px 0 8px}
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{font-size:clamp(20px,1.5vw,28px);font-weight:900}
.sh .num{font-size:13px;color:#fff;background:#000;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;vertical-align:3px}
.sh .cur{font-size:14px;color:#ff3d7f;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font-size:15px;padding:8px 18px;border-radius:22px;border:1px solid #ddd;color:#444}
.tab:hover{border-color:#999}
.tab.on{background:#000;color:#fff;border-color:#000;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,8.5vw,240px),1fr));gap:clamp(12px,0.8vw,20px)}
.card{text-align:center;display:block}
.card .th{aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:3px solid transparent;position:relative;background:#eee;transition:border-color .15s,transform .15s}
.card:hover .th{transform:translateY(-2px)}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card.on .th{border-color:#ff3d7f}
.card.on .th:after{content:"✓";position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#ff3d7f;color:#fff;font-size:14px;line-height:26px;font-weight:800}
.card p{font-size:clamp(13px,0.75vw,17px);margin-top:7px;line-height:1.3;word-break:keep-all;color:#222}
.card.on p{font-weight:800;color:#ff3d7f}
.foot{padding:30px 0 40px;color:#aaa;font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.85);color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:700px){
  .brand{display:none}
  .bar{gap:8px;padding:10px 0 8px}
  .sel .mini{width:46px;height:46px}
  .result{flex:1 1 calc(100% - 110px);min-height:46px;font-size:17px;padding:8px 12px}
  .ctrl{width:100%}
  .gbtn{height:40px;padding:0 12px;font-size:14px}
  .act{flex:1;height:44px;padding:0 10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .card p{font-size:12px}
  .tab{font-size:13px;padding:6px 12px}
  section{padding:18px 0 4px}
}
</style>
<link rel="icon" href="favicon.svg"></head>

      <button class="act copy" id="copyBtn">복사</button>
    </div>
  </div>
  <div class="hist" id="hist"></div>
</div></div>
<main class="wrap">
  <section id="secStyle">
    <div class="sh"><h2><span class="num">1</span>스타일</h2><span class="cur" id="curS"></span></div>
    <div class="tabs" id="sTabs"></div>

</main>

const IMG_C={"애쉬브라운": "c01", "초코브라운": "c02", "밀크브라운": "c03", "버건디": "c04", "애쉬그레이": "c05", "핑크브라운": "c06", "블루블랙": "c07", "카키브라운": "c08", "로즈골드": "c09", "실버": "c10", "라즈베리": "c11", "진저": "c12", "아이스블론드": "c13", "애쉬베이지": "c14", "오프블랙": "c15", "블론드": "c16", "카라멜브라운": "c17", "다크브라운": "c18", "체리초콜릿": "c19", "코퍼": "c20", "밀크티베이지": "c21", "내추럴블랙": "c22", "파이어레드": "c23", "체리레드": "c24", "핫핑크": "c25", "퍼플": "c26", "라벤더": "c27", "로열블루": "c28", "스카이블루": "c29", "민트": "c30", "에메랄드": "c31", "오렌지": "c32", "레몬옐로": "c33", "플래티넘": "c34", "카라멜 하이라이트": "c35", "블론드 하이라이트": "c36", "애쉬 브릿지": "c37", "핑크 브릿지": "c38", "블루 브릿지": "c39", "이너컬러 레드": "c40", "이너컬러 퍼플": "c41", "페이스 프레이밍 블론드": "c42", "옴브레 블론드": "c43", "핑크 옴브레": "c44", "블루 옴브레": "c45", "라벤더 옴브레": "c46", "애쉬 발레아쥬": "c47", "카라멜 발레아쥬": "c48", "선셋 그라데이션": "c49", "실버 옴브레": "c50", "레오파드 포인트": "c51", "레인보우": "c52", "갤럭시": "c53", "유니콘 파스텔": "c54", "홀로그램 실버": "c55", "네온 그린": "c56"};
function styleImg(tab,name){const id=(STYLE_TABS[tab].male?IMG_M:IMG_W)[name];return id?`images/${id}.jpg`:"";}
function colorImg(name){const id=IMG_C[name];return id?`images/${id}.jpg`:"";}
/* ---------- 상태 ---------- */
const S={sTab:5,cTab:1,style:null,color:null,gender:"여자",gManual:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ---------- 텍스트 변환 ---------- */
function styleText(n){return n.replace(/씨컬/g,"C컬").replace(/에스컬/g,"S컬").replace(/제이컬/g,"J컬");}
function colorText(n){return n.endsWith("컬러")?n:(n.includes(" ")?n+" 컬러":n+"컬러");}
function sentence(){
  if(!S.style&&!S.color) return "";
  const parts=[S.gender+"헤어"];
  if(S.style) parts.push(styleText(S.style.n));
  if(S.color) parts.push(colorText(S.color.n));
  return parts.join(" ");
}
/* ---------- 렌더 ---------- */
function tabsHTML(tabs,cur){return tabs.map((t,i)=>`<button class="tab${i===cur?" on":""}" data-i="${i}">${t.t}</button>`).join("");}
function card(i,name,src,sel){return `<button class="card${sel?" on":""}" data-i="${i}"><div class="th"><img loading="lazy" decoding="async" src="${src}" alt="${esc(name)}" width="400" height="400"></div><p>${esc(name)}</p></button>`;}
function renderStyle(){
  $("sTabs").innerHTML=tabsHTML(STYLE_TABS,S.sTab);
  $("sGrid").innerHTML=STYLE_TABS[S.sTab].items.map((it,i)=>card(i,it[0],styleImg(S.sTab,it[0]),S.style&&S.style.tab===S.sTab&&S.style.i===i)).join("");
}
function renderColor(){
  $("cTabs").innerHTML=tabsHTML(COLOR_TABS,S.cTab);
  $("cGrid").innerHTML=COLOR_TABS[S.cTab].items.map((it,i)=>card(i,it[0],colorImg(it[0]),S.color&&S.color.tab===S.cTab&&S.color.i===i)).join("");
}
function mini(el,obj,src,label,key){
  el.innerHTML=obj?`<img src="${src}" alt=""><b data-x="${key}" title="선택 해제">✕</b>`:`<span>${label}</span>`;
}
function renderResult(){
  const s=sentence(), r=$("result");
  r.textContent=s||"스타일과 컬러를 선택하세요"; r.classList.toggle("empty",!s);
  document.querySelectorAll(".gbtn").forEach(b=>b.classList.toggle("on",b.dataset.g===S.gender));
  mini($("miniS"),S.style,S.style&&styleImg(S.style.tab,S.style.n),"스타일","style");
  mini($("miniC"),S.color,S.color&&colorImg(S.color.n),"컬러","color");
  $("curS").textContent=S.style?"선택: "+S.style.n:"";
  $("curC").textContent=S.color?"선택: "+S.color.n:"";
}
/* ---------- 이벤트 ---------- */
$("sTabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;S.sTab=+b.dataset.i;renderStyle();};
$("cTabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;S.cTab=+b.dataset.i;renderColor();};
$("sGrid").onclick=e=>{const b=e.target.closest(".card");if(!b)return;const i=+b.dataset.i;
  if(S.style&&S.style.tab===S.sTab&&S.style.i===i)S.style=null;
  else{S.style={tab:S.sTab,i,n:STYLE_TABS[S.sTab].items[i][0]};
    if(!S.gManual)S.gender=STYLE_TABS[S.sTab].male?"남자":"여자";}
  renderStyle();renderResult();};
$("cGrid").onclick=e=>{const b=e.target.closest(".card");if(!b)return;const i=+b.dataset.i;
  if(S.color&&S.color.tab===S.cTab&&S.color.i===i)S.color=null;
  else S.color={tab:S.cTab,i,n:COLOR_TABS[S.cTab].items[i][0]};
  renderColor();renderResult();};
document.querySelectorAll(".gbtn").forEach(b=>b.onclick=()=>{S.gender=b.dataset.g;S.gManual=true;renderResult();});
document.querySelector(".sel").onclick=e=>{const x=e.target.dataset.x;if(!x)return;S[x]=null;renderStyle();renderColor();renderResult();};
function reset(){S.style=null;S.color=null;S.gManual=false;S.gender="여자";renderStyle();renderColor();renderResult();toast("초기화했어요");}
$("resetBtn").onclick=reset;
/* ---------- 복사 ---------- */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);return ok;}
async function copyText(text){
  if(!text){toast("먼저 스타일이나 컬러를 선택하세요");return;}
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
  if(!ok)ok=fallbackCopy(text);
  toast(ok?"복사했어요: "+text:"복사 실패 — 직접 선택해서 복사하세요");
  if(ok)addHist(text);
}
$("copyBtn").onclick=()=>copyText(sentence());
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="c"&&!String(window.getSelection())){const s=sentence();if(s){e.preventDefault();copyText(s);}}});
/* ---------- 기록 ---------- */
const HK="bp-hair-history";
function getHist(){try{return JSON.parse(localStorage.getItem(HK))||[]}catch(e){return []}}
function addHist(t){let h=getHist().filter(x=>x.t!==t);h.unshift({t,d:Date.now()});h=h.slice(0,20);try{localStorage.setItem(HK,JSON.stringify(h));}catch(e){}renderHist();}
function renderHist(){const h=getHist();
  $("hist").innerHTML='<span class="lbl">복사 기록</span>'+(h.length?h.map(x=>{const d=new Date(x.d);return `<span class="h" data-t="${esc(x.t)}" title="${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")} · 눌러서 다시 복사">${esc(x.t)}</span>`}).join("")+'<button class="clr" id="clearHist">지우기</button>':'<span class="none">아직 복사한 문장이 없어요</span>');}
$("hist").onclick=e=>{if(e.target.id==="clearHist"){localStorage.removeItem(HK);renderHist();return;}const h=e.target.closest(".h[data-t]");if(h)copyText(h.dataset.t);};
renderStyle();renderColor();renderResult();renderHist();
</script>
</body>
</html>
